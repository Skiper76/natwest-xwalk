<form class="mortgage-calculator-form">
  <div class="mortgage-calculator-field">
    <label for="mc-amount">Loan amount (&#163;)</label>
    <input id="mc-amount" name="amount" type="number" min="1000" step="1000" value="250000" required>
  </div>
  <div class="mortgage-calculator-field">
    <label for="mc-rate">Interest rate (%)</label>
    <input id="mc-rate" name="rate" type="number" min="0" max="20" step="0.1" value="4.5" required>
  </div>
  <div class="mortgage-calculator-field">
    <label for="mc-term">Term (years)</label>
    <input id="mc-term" name="term" type="number" min="1" max="40" step="1" value="25" required>
  </div>
  <button type="submit" class="mortgage-calculator-submit">Calculate</button>
  <p class="mortgage-calculator-result" aria-live="polite"></p>
</form>
